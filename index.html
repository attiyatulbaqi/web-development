<html>   
  <heading>   
    <title>       
      FACEBOOK FORM.PK
    </title>   
  </heading>  
  <body>     
   <h1> REGISTRATION FORM </h1>
    <FORM>     
  <!-- personal Information --> 
  <FIELDSET> 
    <LEGEND> 
      PERSONAL INFO 
    </LEGEND>
<!-- NAME -->
    <label FOR="NAME">NAME :</label>
    <input type="text" NAME="fullname" ID="NAME" placeholder="ENTER YOUR FULL NAME" REQUIRED> <BR></BR> 
<!-- PHONE NO -->
    <LABEL FOR="PHONE">PHONE NO :</LABEL>
    <input type="tel" placeholder="03XX-XXXXXXX" ID="PHONE" REQUIRED> <BR></BR> 
<!-- DATE OF BIRTH -->
    <label required>DATE OF BIRTH :</label>  
<!--MONTH -->
    <SELECT NAME="MONTH">

      <option value="9">SEP</option>
      <option value="10">OCT</option>
      <option value="11">NOV</option>
      <option value="12">DEC</option>

<!-- DATE -->
    <SELECT NAME="">

      <option value="19">19</option>
      <option value="20">20</option>
      <option value="21">21</option>
      <option value="22">22</option>
      <option value="23">23</option>
      <option value="24">24</option>
      <option value="25">25</option>
      <option value="26">26</option>
      <option value="27">27</option>
      <option value="28">28</option>
      <option value="29">29</option>
      <option value="30">30</option>
      <option value="31">31</option>
    </select> 
<!-- YEAR-->
    <SELECT NAME="YEAR"> 
      <option value="0">YEAR</option> 
      <option value="1">2026</option> 
      <option value="2">2025</option> 
      <option value="3">2024</option> 
      <option value="4">2023</option> 
      <option value="5">2022</option> 
      <option value="6">2021</option> 
      <option value="7">2020</option>
      <option value="8">2019</option> 
      <option value="9">2018</option> 
      <option value="10">2017</option>
      <option value="11">2016</option>
      <option value="12">2015</option>
      <option value="13">2014</option>
      <option value="14">2013</option> 
      <option value="15">2012</option> 
      <option value="16">2011</option>
      <option value="17">2010</option>

      <option value="29">1998</option>
      <option value="30">1997</option> 
      <option value="31">1996</option>
    </select>
    <br><br>
<!-- GENDER --> 
    <label FOR="G">GENDER : </label>  
    <label>Male</label> 
    <input type="radio" name="Gender" value="male" id="G"> 
    <label >Female</label> <input type="radio" name="Gender" value="Female" id="G"> 
    <label >Other</label> <input type="radio" name="Gender" value="Other" id="G"> 
    <br><br> 
<!-- AGE -->
    <label required>AGE : </label> 
    <INPUT type="number" name="AGE" id="AGE"  required min="1" max="80">
  </FIELDSET> 
     <BR></BR> 
  <FIELDSET>
<!-- ACCOUNT INFORMATION -->
       <LEGEND>ACCOUNT INFORMATION</LEGEND> 
<!-- EMAIL -->    
    <LABEL>EMAIL : </LABEL> 
    <INPUT TYPE="email" NAME="Email" placeholder="XXXX@gmai.com " REQUIRED>
    <BR><BR> 
<!-- PASSWORD -->  
    <LABEL>PASSWORD : </LABEL>
    <INPUT TYPE="PASSWORD" NAME="PASSWORD" placeholder="ENTER YOUR PASSWORD" REQUIRED>
  </FIELDSET> 
     <BR> 
  <FIELDSET>
<!-- COURSES -->
    <LEGEND>COURSES</LEGEND>
    <INPUT TYPE="checkbox" NAME="OFFICE MANAGEMENT " > 
    <LABEL>OFFICE MANAGEMENT</LABEL>  
    <BR></BR> 
    <INPUT TYPE="checkbox" NAME="VIDEO EDITING" >   
    <LABEL>VIDEO EDITING</LABEL>   
    <BR></BR>
    <INPUT TYPE="checkbox" NAME="WEB DEVELOPEMENT" > 
    <LABEL>WEB DEVELOPEMENT</LABEL>        
    <BR></BR>    
    <INPUT TYPE="checkbox" NAME="GRAPHIC DESIGHNING" >    
    <LABEL>GRAPHIC DESIGHNING</LABEL>  
    <BR></BR>    
    <INPUT TYPE="checkbox" NAME="ARTIFICAL INTELEGENCE" >    
    <LABEL>ARTIFICAL INTELEGENCE</LABEL> 
    <BR></BR> 
    <INPUT TYPE="checkbox" NAME="DIGITAL MARKETING" >    
    <LABEL>DIGITAL MARKETING</LABEL>  
    <BR></BR> 
    </FIELDSET>
     <BR> 
     <FIELDSET>
  <!-- ADDRESS INFORMATION -->    
       <LEGEND>ADDRESS INFORMATION</LEGEND>      
       <LABEL>COUNTRY</LABEL>
       <SELECT>
         <OPTION>--SELECT COUNTRY--</OPTION>       
         <OPTION>PAKISTAN</OPTION>    
         <OPTION>INDIA</OPTION> 
         <OPTION>JAPAN</OPTION>   
         <OPTION>CHINA</OPTION>   
         <OPTION>KOREA</OPTION>   
         <OPTION>AMERICA</OPTION>     
         <OPTION>FRANCE</OPTION>      
         <OPTION>GERMANY</OPTION>      
         <OPTION>CANADA</OPTION>   
       </SELECT> 
       <FIELDSET>
       <BR></BR> 
  <!-- ADDRESS --> 
       <FIELDSET>
       <LABEL>ADDRESS :</LABEL>
       <BR>     
       <TEXTAREA ID="ADDRESS" NAME="ADDRESS" ROWS="3" COLS="30" placeholder="ENTER YOUR ADDRESS" REQUIRED></textarea>  
      <BR> 
      </FIELDSET>  
      <BR>
      <FIELDSET>    
  <!-- PROFILE --> 
         <LEGEND>PROFILE</LEGEND> 
         <LABEL>UPLOAD PROFILE PICTURE : </LABEL> 
         <INPUT TYPE="FILE" ID="PROFILE" NAME="PROFILE"> 
      </FIELDSET> 
         <BR>
         <FIELDSET>    
<!-- TERMS AND CONDITIONS -->
           <LEGEND>TERMS & CONDITIONS</LEGEND>
           <INPUT TYPE="checkbox" REQUIRED> 
           <LABEL>I AGREE TO THE TERMS & CONDITIONS</LABEL> 
         </FIELDSET>
         <BR>
  <!-- BUTTONS -->   
         <INPUT TYPE="SUBMIT" VALUE="SUBMIT">
         <INPUT TYPE="RESET" VALUE="RESET"> 
       </form>
      </body>
      </html>
